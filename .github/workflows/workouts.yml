name: Workouts

# Compiles workouts/workouts.yaml into workouts.json and publishes it on GitHub Pages.
# Pull requests are validated by the CI workflow; pushes to main deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Compile workouts
        run: |
          bazel build //workouts:dist
          # Resolve the bazel-bin symlink and read-only permissions for the upload.
          cp -rL bazel-bin/workouts/dist dist
          chmod -R u+w dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Requires Settings -> Pages -> Source: GitHub Actions.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
