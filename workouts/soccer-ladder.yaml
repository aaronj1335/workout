name: Soccer Ladder
description: Agility-ladder footwork for soccer

steps:
  - name: Two feet in each square
    reps: 2
  - name: One foot in each square
    reps: 2
  - name: Icky shuffle
    reps: 2
    notes: Lead with the outside foot each pass
  - name: In-in-out-out
    reps: 2
  - name: Lateral shuffle
    reps: 2
    notes: One pass facing each direction
  - name: Hopscotch
    reps: 2
  - name: Single-leg hops
    reps: 2
    notes: Left leg down, right leg back
  - name: Sprint out
    reps: 4
    notes: 10 yards past the last rung
